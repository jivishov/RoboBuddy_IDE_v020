name: One-shot OpenArm observation cadence repair

on:
  push:
    branches: ["fix/openarm-phase5a-fidelity-review"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cadence-50ms-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set efficient authoritative observation cadence
        run: |
          python - <<'PY'
          from pathlib import Path

          simulator = Path('src/physics/openarm-physical-simulator.js')
          text = simulator.read_text()
          old = 'const OPENARM_OBSERVATION_BATCH_STEPS = 20; // 20 ms at the pinned 0.001 s timestep.'
          new = 'const OPENARM_OBSERVATION_BATCH_STEPS = 50; // 50 ms at the pinned 0.001 s timestep; matches native evidence sampling cadence.'
          if text.count(old) != 1:
              raise SystemExit(f'expected one OpenArm observation cadence declaration, found {text.count(old)}')
          simulator.write_text(text.replace(old, new, 1))

          browser = Path('tests/openarm-phase5a-browser.spec.mjs')
          text = browser.read_text()
          old = "    legacyBaseYawRendered: false,\n  });"
          new = "    legacyBaseYawRendered: false,\n    observationBatchSteps: 50,\n    observationPeriodSeconds: 0.05,\n  });"
          if text.count(old) != 1:
              raise SystemExit(f'expected one presentation audit assertion block, found {text.count(old)}')
          browser.write_text(text.replace(old, new, 1))
          PY
      - name: Check patched contracts
        run: |
          node --check src/physics/openarm-physical-simulator.js
          node --check tests/openarm-phase5a-browser.spec.mjs
      - name: Commit cadence repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/openarm-physical-simulator.js tests/openarm-phase5a-browser.spec.mjs
          git commit -m "fix(openarm): sample authoritative state at 50 ms cadence [cadence-50ms-patched]"
          git push
