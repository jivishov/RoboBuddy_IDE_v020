name: Apply reviewed Asimov browser corrections
on:
  push:
    branches: [integration/asimov-actuator-fidelity-20260911]
    paths: [.github/workflows/asimov-browser-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'jivishov/RoboBuddy_IDE_v020'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/asimov-actuator-fidelity-20260911
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-verified application-only patch
        shell: python
        run: |
          import base64,hashlib,lzma,pathlib,subprocess
          encoded=''''''
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='0de86c71acd74249a9d14921dd38d9c7c60c46e948bf23da65ef7e769c7acb2b'
          patch=pathlib.Path('/tmp/asimov-browser.patch');patch.write_bytes(lzma.decompress(data))
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
      - name: Check and commit application changes
        run: |
          node tests/physics/asimov-browser-boundary-core.mjs
          node tests/physics/physical-python-runtime-core.mjs
          node tests/physics/asimov-sensor-owner-core.mjs
          node tests/physics/asimov-actuator-worker.mjs
          node tests/validate.mjs
          python tests/validate_starters.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs
          git commit -m 'fix: bound long Asimov trials, avoid redundant mesh rendering and expose standing evidence through WebMCP'
          git push origin HEAD:integration/asimov-actuator-fidelity-20260911
