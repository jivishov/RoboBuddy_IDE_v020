name: Guarded OpenArm coupling reset patch

on:
  push:
    branches: ["fix/openarm-phase5a-fidelity-review"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch browser and native setup to satisfy source finger coupling at reset
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('src/physics/openarm-mujoco-worker.js')
          text = worker.read_text()
          if 'let couplingState = new Map();' not in text:
              text = text.replace('let jointState = new Map();\nlet actuatorState = new Map();', 'let jointState = new Map();\nlet couplingState = new Map();\nlet actuatorState = new Map();')
              text = text.replace('  jointState = new Map(); actuatorState = new Map(); bodyState = new Map();', '  jointState = new Map(); couplingState = new Map(); actuatorState = new Map(); bodyState = new Map();')
              marker = "  for (const actuator of descriptor.actuators) {"
              insert = """  for (const coupling of descriptor.mechanicalCouplings || []) {\n    const driver = jointState.get(coupling.driverJointId);\n    if (!driver) throw new Error(`Mechanical coupling ${coupling.id} references unknown driver ${coupling.driverJointId}`);\n    if (jointState.has(coupling.followerJointId)) throw new Error(`Mechanical coupling follower ${coupling.followerJointId} collides with a declared command joint`);\n    const id = idFor('mjOBJ_JOINT', coupling.followerJointId);\n    const qpos = Number(model.jnt_qposadr[id]);\n    const dof = Number(model.jnt_dofadr[id]);\n    const range = [Number(model.jnt_range[id * 2]), Number(model.jnt_range[id * 2 + 1])];\n    const axis = [Number(model.jnt_axis[id * 3]), Number(model.jnt_axis[id * 3 + 1]), Number(model.jnt_axis[id * 3 + 2])];\n    const resolved = { ...coupling, driver, id, qpos, dof, range, axis, passiveCoupled: true };\n    couplingState.set(coupling.id, resolved);\n    jointState.set(coupling.followerJointId, { id, qpos, dof, range, axis, passiveCoupled: true });\n  }\n"""
              text = text.replace(marker, insert + marker, 1)
              old = "  paused = false;\n  mujoco.mj_forward(model, data);\n  return observation();"
              new = """  for (const coupling of couplingState.values()) {\n    const driverValue = Number(data.qpos[coupling.driver.qpos]);\n    const followerValue = driverValue * Number(coupling.multiplier ?? 1) + Number(coupling.offsetRad ?? 0);\n    if (!Number.isFinite(followerValue)) throw new Error(`Mechanical coupling ${coupling.id} produced a non-finite setup value`);\n    if (coupling.range.every(Number.isFinite) && (followerValue < coupling.range[0] || followerValue > coupling.range[1])) throw new RangeError(`Mechanical coupling ${coupling.id} setup value ${followerValue} is outside follower range ${coupling.range[0]}..${coupling.range[1]}`);\n    data.qpos[coupling.qpos] = followerValue;\n  }\n  paused = false;\n  mujoco.mj_forward(model, data);\n  return observation();"""
              if old not in text:
                  raise SystemExit('worker setup insertion point not found')
              text = text.replace(old, new, 1)
              old_dispose = 'jointState = new Map(); actuatorState = new Map(); bodyState = new Map(); modelInfo = null; paused = false;'
              new_dispose = 'jointState = new Map(); couplingState = new Map(); actuatorState = new Map(); bodyState = new Map(); modelInfo = null; paused = false;'
              if old_dispose not in text:
                  raise SystemExit('worker dispose insertion point not found')
              text = text.replace(old_dispose, new_dispose, 1)
              worker.write_text(text)

          native = Path('native/openarm_v2_reference.py')
          text = native.read_text()
          if "PASSIVE_COUPLED_JOINTS =" not in text:
              text = text.replace("ACTUATORS = [\n", "PASSIVE_COUPLED_JOINTS = {\n    'openarm_left_finger_joint2': 'openarm_left_finger_joint1',\n    'openarm_right_finger_joint2': 'openarm_right_finger_joint1',\n}\nACTUATORS = [\n", 1)
              old = """    for joint, value in INITIAL.items():\n        data.qpos[int(model.jnt_qposadr[joints[joint]])] = value\n        data.ctrl[acts[joint]] = value\n    # Explicit negative setup intervention only; nominal free-object qpos is untouched."""
              new = """    for joint, value in INITIAL.items():\n        data.qpos[int(model.jnt_qposadr[joints[joint]])] = value\n        data.ctrl[acts[joint]] = value\n    # The source equality constraint couples finger2 to finger1. Reset must begin\n    # on that mechanical manifold; otherwise the constraint impulse itself can\n    # strike nearby vessels before any commanded motion occurs.\n    for follower, driver in PASSIVE_COUPLED_JOINTS.items():\n        follower_id = mujoco.mj_name2id(model, mujoco.mjtObj.mjOBJ_JOINT, follower)\n        driver_id = joints[driver]\n        data.qpos[int(model.jnt_qposadr[follower_id])] = data.qpos[int(model.jnt_qposadr[driver_id])]\n    # Explicit negative setup intervention only; nominal free-object qpos is untouched."""
              if old not in text:
                  raise SystemExit('native setup insertion point not found')
              text = text.replace(old, new, 1)
              native.write_text(text)

          probe = Path('.github/workflows/openarm-design-probe.yml')
          text = probe.read_text()
          old = "j=id_(mujoco.mjtObj.mjOBJ_JOINT,f'openarm_{s}_finger_joint1'); data.qpos[int(model.jnt_qposadr[j])]=(0.65 if s=='left' else -0.65)"
          new = """for finger_index in (1,2):\n                j=id_(mujoco.mjtObj.mjOBJ_JOINT,f'openarm_{s}_finger_joint{finger_index}'); data.qpos[int(model.jnt_qposadr[j])]=(0.65 if s=='left' else -0.65)"""
          if old in text:
              text = text.replace(old, new, 1)
          old = "j=id_(mujoco.mjtObj.mjOBJ_JOINT,f'openarm_{side}_finger_joint1'); data.qpos[int(model.jnt_qposadr[j])]=finger"
          new = """for finger_index in (1,2):\n              j=id_(mujoco.mjtObj.mjOBJ_JOINT,f'openarm_{side}_finger_joint{finger_index}'); data.qpos[int(model.jnt_qposadr[j])]=finger"""
          if old in text:
              text = text.replace(old, new, 1)
          probe.write_text(text)
          PY
      - name: Commit only when patch changed files
        run: |
          if git diff --quiet; then
            echo "Coupling reset patch already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/openarm-mujoco-worker.js native/openarm_v2_reference.py .github/workflows/openarm-design-probe.yml
          git commit -m "fix(openarm): initialize coupled passive fingers on reset [coupling-patched]"
          git push
