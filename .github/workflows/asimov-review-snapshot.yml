name: Asimov review snapshot
on:
  push:
    branches: [integration/asimov-sensor-webmcp-20260912]
    paths: ['.github/workflows/asimov-review-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'jivishov/RoboBuddy_IDE_v020'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked baseline only
        run: git archive --format=tar.gz HEAD -o /tmp/asimov-review-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: asimov-review-source
          path: /tmp/asimov-review-source.tar.gz
          retention-days: 3
