name: Finalize MicroDuck physical presentation
on:
  push:
    branches: [fix/microduck-presentation-final]
    paths: [.github/workflows/finalize-microduck-presentation.yml]
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    if: github.repository == 'jivishov/RoboBuddy_IDE_v020'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact candidate from the completed 15-test Chromium verification
        uses: actions/download-artifact@v4
        with:
          name: microduck-presentation-evidence
          run-id: 34512406470
          github-token: ${{ github.token }}
          path: /tmp/verified-presentation
      - name: Reproduce and byte-compare the verified application and test sources
        run: |
          python3 scripts/repair_microduck_ground.py
          python3 scripts/finalize_microduck_presentation.py
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          root = Path('/tmp/verified-presentation')
          assert '15 passed' in (root / 'presentation-browser.log').read_text()
          # The previous job passed every test but git diff --cached --check rejected
          # a trailing blank line in the newly extracted parity spec. Reuse that exact
          # tested candidate, not a skipped or weakened browser test. PR CI reruns it all.
          with tarfile.open(root / 'candidate-source.tar.gz') as archive:
              count = 0
              for member in archive.getmembers():
                  name = member.name.removeprefix('./')
                  if not member.isfile() or not (name.startswith(('src/', 'tests/', 'models/', 'assets/', 'native/')) or name in ('README.md', 'playwright.config.mjs')):
                      continue
                  assert Path(name).read_bytes() == archive.extractfile(member).read(), name
                  count += 1
          assert count > 100
          print(f'{count} application, test and model files match the browser-verified candidate byte-for-byte')
          path = Path('tests/microduck-policy-parity.spec.mjs')
          path.write_text(path.read_text().rstrip('\n') + '\n')
          print('Only subsequent test change: remove the extra blank line at EOF')
          PY
          git diff --exit-code -- models assets native
          git diff --check
      - name: Recheck permanent contracts and syntax after whitespace-only cleanup
        run: |
          node --check src/microduck/rig-adapter.js
          node --check src/physics/microduck-physical-simulator.js
          node --check tests/microduck-policy-parity.spec.mjs
          node tests/physics/microduck-presentation-core.mjs
          node tests/physics/microduck-phase5c-core.mjs
          node tests/physics/microduck-cancellation-core.mjs
          node tests/physics/microduck-interfaces-core.mjs
          node tests/physics/microduck-lifecycle-core.mjs
          node tests/validate_microduck_assets.mjs
          node tests/validate.mjs
          python3 scripts/generate_microduck_models.py --check
      - name: Commit tested application sources and remove repair scaffolding
        run: |
          git diff --exit-code -- models assets native
          rm scripts/repair_microduck_ground.py scripts/finalize_microduck_presentation.py .github/workflows/microduck-ground-repair.yml .github/workflows/finalize-microduck-presentation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs README.md playwright.config.mjs .github/workflows scripts/repair_microduck_ground.py scripts/finalize_microduck_presentation.py
          git diff --cached --check
          git commit -m 'fix(microduck): align all rendered bodies with contact snapshots and retire legacy tasks'
          git push origin HEAD:fix/microduck-presentation-final
