name: Finalize MicroDuck physical presentation
on:
  push:
    branches: [fix/microduck-presentation-final]
    paths: [.github/workflows/finalize-microduck-presentation.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'jivishov/RoboBuddy_IDE_v020'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize reviewed presentation corrections
        run: |
          python3 scripts/repair_microduck_ground.py
          python3 scripts/finalize_microduck_presentation.py
          git diff --exit-code -- models assets native
          git diff --check
      - name: Syntax, asset integrity and physical contracts
        run: |
          for path in src/microduck/rig-adapter.js src/physics/microduck-physical-simulator.js src/physics/microduck-model-package.js src/task-catalog.js src/profiles.js src/simulator-host.js tests/microduck-presentation-browser.spec.mjs tests/microduck-policy-parity.spec.mjs tests/webmcp.spec.mjs; do node --check "$path"; done
          node tests/physics/microduck-presentation-core.mjs
          node tests/physics/microduck-phase5c-core.mjs
          node tests/physics/microduck-cancellation-core.mjs
          node tests/physics/microduck-interfaces-core.mjs
          node tests/physics/microduck-lifecycle-core.mjs
          node tests/physics/microduck-bam-plant-core.mjs
          node tests/physics/model-registry-core.mjs
          node tests/validate_microduck_assets.mjs
          node tests/validate.mjs
          node tests/validate_task_patch.mjs
          node tests/validate_canonical_visuals.mjs
          node tests/webmcp-core.mjs
          python3 scripts/generate_microduck_models.py --check
          python3 tests/validate_starters.py
          python3 tests/execute_starters.py
      - name: Install pinned Chromium harness
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
      - name: Verify contact-aligned visuals, task routing, Python, WebMCP and cancellation
        run: |
          set +e
          npx playwright test tests/microduck-presentation-browser.spec.mjs tests/microduck-interfaces-browser.spec.mjs tests/microduck-policy-parity.spec.mjs tests/webmcp.spec.mjs --reporter=line > /tmp/presentation-browser.log 2>&1
          code=$?
          grep -E 'SETTLED|MOVING|cancellation evidence|Error:|Expected:|Received:|passed|failed' /tmp/presentation-browser.log || true
          tail -60 /tmp/presentation-browser.log
          exit "$code"
      - name: Retain candidate source and actual screenshots
        if: always()
        run: |
          mkdir -p /tmp/microduck-presentation-evidence
          cp /tmp/presentation-browser.log /tmp/microduck-presentation-evidence/ 2>/dev/null || true
          cp -r test-results /tmp/microduck-presentation-evidence/ 2>/dev/null || true
          git diff -- src tests docs README.md playwright.config.mjs .github/workflows > /tmp/microduck-presentation-evidence/candidate.patch
          tar --exclude=.git --exclude=node_modules --exclude=test-results --exclude=playwright-report -czf /tmp/microduck-presentation-evidence/candidate-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microduck-presentation-evidence
          path: /tmp/microduck-presentation-evidence
          retention-days: 14
      - name: Commit tested application sources and remove repair scaffolding
        run: |
          git diff --exit-code -- models assets native
          rm scripts/repair_microduck_ground.py scripts/finalize_microduck_presentation.py .github/workflows/microduck-ground-repair.yml .github/workflows/finalize-microduck-presentation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs README.md playwright.config.mjs .github/workflows scripts/repair_microduck_ground.py scripts/finalize_microduck_presentation.py
          git diff --cached --check
          git commit -m 'fix(microduck): align all rendered bodies with contact snapshots and retire legacy tasks'
          git push origin HEAD:fix/microduck-presentation-final
