name: OpenArm refinement verification
on:
  push:
    branches: [fix/openarm-contact-workcell-webmcp]
permissions:
  contents: write
jobs:
  repair-and-verify:
    if: github.repository == 'jivishov/RoboBuddy_IDE_v020' && github.ref == 'refs/heads/fix/openarm-contact-workcell-webmcp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openarm-contact-workcell-webmcp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused browser findings on isolated branch
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='jivishov/RoboBuddy_IDE_v020'
          assert os.environ['GITHUB_REF']=='refs/heads/fix/openarm-contact-workcell-webmcp'
          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              assert text.count(old)==1,(path,old)
              p.write_text(text.replace(old,new))
          replace('src/task-catalog.js','pythonWallTimeMs: 180000','pythonWallTimeMs: 120000')
          replace('src/physics/capabilities.js','browser collision meshes are explicit primitive surrogates rather than upstream mesh collisions.','decomposed collision meshes and their rendered geometry now share the pinned source components; servo reference limits and the conservative gripper cap are declared simulation estimates.')
          replace('tests/openarm-workcell-browser.spec.mjs','window.ready,{timeout:60000}','window.ready, null, {timeout:60000}')
          replace('tests/openarm-phase5a-browser.spec.mjs',"  await expect(page.locator('#statusMessage')).toContainText('Run complete', { timeout: 180_000 });", "  await page.waitForFunction(() => /Run complete|run failed/i.test(document.querySelector('#statusMessage').textContent), null, { timeout: 180_000 });\n  const runStatus = await page.locator('#statusMessage').textContent();\n  if (!runStatus.includes('Run complete')) await writeFile(testInfo.outputPath('python-run-failure.txt'), await page.locator('body').innerText());\n  expect(runStatus).toContain('Run complete');")
          replace('src/physics/openarm-physical-simulator.js',"  fit() { this.controls.target.set(415, 1050, 0); this.camera.position.set(1590, 1620, 1130); this.camera.updateProjectionMatrix(); this.controls.update(); return true; }", "  fit() {\n    this.controls.target.set(415, 1050, 0);\n    const scale = Math.max(1, 1.18 / this.camera.aspect);\n    this.camera.position.copy(this.controls.target).add(new THREE.Vector3(1175, 570, 1130).multiplyScalar(scale));\n    this.camera.updateProjectionMatrix(); this.controls.update(); return true;\n  }")
          PY
          git add src/task-catalog.js src/physics/capabilities.js src/physics/openarm-physical-simulator.js tests/openarm-workcell-browser.spec.mjs tests/openarm-phase5a-browser.spec.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(openarm): align Python deadline, update fidelity labels and fit narrow viewports'
          git push origin HEAD:refs/heads/fix/openarm-contact-workcell-webmcp
      - name: Static and shared-runtime regression checks
        run: |
          node tests/physics/openarm-phase5a-core.mjs
          node tests/physics/live-python-bridge-core.mjs
          node tests/physics/physical-python-runtime-core.mjs
          node tests/physics/vertical-slice-core.mjs
          node tests/physics/model-registry-core.mjs
          node tests/webmcp-core.mjs
          node tests/validate_task_patch.mjs
      - name: Install pinned test dependencies
        run: |
          python -m pip install 'mujoco==3.11.0' 'jsonschema==4.26.0'
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Full IDE and registered equipment-program browser tests
        run: npx playwright test tests/openarm-phase5a-browser.spec.mjs tests/openarm-workcell-browser.spec.mjs --reporter=line
      - name: Native nominal and half-timestep comparison
        if: always()
        run: |
          mkdir -p test-results/native
          python tests/validate_openarm_schemas.py
          python native/openarm_v2_reference.py --trial nominal > test-results/native/openarm-nominal.json
          python native/openarm_v2_reference.py --trial nominal --timestep 0.0005 > test-results/native/openarm-tight.json
          python - <<'PY'
          import json,math
          from pathlib import Path
          root=Path('test-results/native');a=json.loads((root/'openarm-nominal.json').read_text());b=json.loads((root/'openarm-tight.json').read_text())
          assert a['metrics']['success'] and b['metrics']['success']
          for obj in ['flask','beaker']:
              d=math.dist(a['metrics'][obj]['finalPositionM'],b['metrics'][obj]['finalPositionM'])
              assert d<.002,(obj,d)
              print(obj,'half-timestep final-position delta (m):',d)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openarm-browser-native-evidence
          path: test-results/
          retention-days: 7
