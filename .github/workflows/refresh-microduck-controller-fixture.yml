name: Refresh MicroDuck controller fixture

on:
  push:
    branches: [fix/microduck-full-plant-fidelity]
    paths: [.github/workflows/refresh-microduck-controller-fixture.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/microduck-full-plant-fidelity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decouple controller fixture from physical plant evolution
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('native/microduck_reference.py')
          text = path.read_text()
          new = r'''def make_fixture(sessions, hashes):
    """Build an independently derived controller-only conformance fixture.

    Physical BAM/MuJoCo behavior is validated by microduck_bam_physical_reference.py.
    This fixture deliberately does not advance a MuJoCo plant: its job is to verify the
    deployed observation layout, ONNX inference bytes, raw-action feedback, mouth exclusion,
    action scaling and target low-pass filters without inheriting any collision or actuator
    approximation. Sensor/joint inputs are a deterministic bounded analytic sequence.
    """
    controller = ReferenceController(sessions)
    samples = []
    command = cmd(vx=0.30)
    sample_ticks = {0, 1, 2, 7, 15, 23}

    def prescribed_state(tick):
        t = tick * PHYSICS_TIMESTEP * CONTROL_DECIMATION
        gyro = np.array([
            0.12 * math.sin(1.7 * t),
            -0.09 * math.cos(1.1 * t),
            0.07 * math.sin(0.9 * t + 0.2),
        ], dtype=np.float64)
        gx = 0.055 * math.sin(0.8 * t)
        gy = -0.045 * math.cos(0.6 * t)
        gz = -math.sqrt(max(0.0, 1.0 - gx * gx - gy * gy))
        gravity = np.array([gx, gy, gz], dtype=np.float64)
        phase = np.arange(1, ACTION_LEN + 1, dtype=np.float64)
        amplitude = 0.018 + 0.0015 * phase
        angle = 0.35 * phase + 1.3 * t
        joint_pos = HOME_RAD + amplitude * np.sin(angle)
        joint_vel = amplitude * 1.3 * np.cos(angle)
        return gyro, gravity, joint_pos, joint_vel

    for tick in range(24):
        gyro, gravity, joint_pos, joint_vel = prescribed_state(tick)
        previous_raw = controller.last_action.copy()
        previous_targets = None if controller.previous_targets is None else controller.previous_targets.copy()
        observation, action, targets, scale = controller.step(
            'walking', gyro, gravity, joint_pos, joint_vel, command)
        if tick in sample_ticks:
            samples.append({
                'tick': tick,
                'simulationTimeSeconds': round(tick * PHYSICS_TIMESTEP * CONTROL_DECIMATION, 6),
                'input': {
                    'gyroRadS': [float(v) for v in gyro],
                    'projectedGravity': [float(v) for v in gravity],
                    'jointPositionRad': [float(v) for v in joint_pos],
                    'jointVelocityRadS': [float(v) for v in joint_vel],
                    'previousRawAction': [float(v) for v in previous_raw],
                    'previousTargetsRad': None if previous_targets is None else [float(v) for v in previous_targets],
                    'command': {'twist': list(command['twist']), 'head': list(command['head']), 'body': {'z': 0.0, 'roll': 0.0, 'pitch': 0.0}},
                },
                'observation': [float(v) for v in observation],
                'rawAction': [float(v) for v in action],
                'actionScale': scale,
                'targetsRad': [float(v) for v in targets],
                'wireTargets': {
                    'order': list(WIRE_JOINT_ORDER),
                    'mouthWireIndex': MOUTH_WIRE_INDEX,
                    'mouthIsPolicyControlled': False,
                },
            })

    walk_path = MODELS['walk']
    return {
        'schema': 'robobuddy.microduck-controller-conformance.v1',
        'generatedBy': 'python native/microduck_reference.py --fixture',
        'independentOf': 'browser implementation and physical plant evolution; derived from pinned deployed controller sources',
        'inputSource': 'deterministic bounded analytic controller-input sequence; no MuJoCo state evolution',
        'pins': {
            'microduck': '590b986bd8c0d50ae02cb3ea2f59c463b6828168',
            'microduck_rl': '519142b1f5bf59fdfd44d06c205119e7fff8e3cb',
            'mujoco': mujoco.__version__,
        },
        'model': {'asset': str(walk_path.relative_to(ROOT)), 'sha256': sha256_file(walk_path)},
        'policy': {'id': 'walking', 'file': POLICY_FILES['walking'], 'sha256': hashes['walking']},
        'contract': {
            'observationWidth': OBS_LEN,
            'actionWidth': ACTION_LEN,
            'layout': {'gyro': [0, 3], 'projectedGravity': [3, 6], 'jointPositionOffset': [6, 20],
                       'jointVelocity': [20, 34], 'previousRawAction': [34, 48], 'command': [48, 61]},
            'policyJointOrder': list(POLICY_JOINT_ORDER),
            'homePositionRad': [float(v) for v in HOME_RAD],
            'actionScale': ACTION_SCALE,
            'headLowpassAlpha': HEAD_LOWPASS,
            'legsLowpassAlpha': LEGS_LOWPASS,
            'headJointSlots': list(HEAD_SLOTS),
            'physicsTimestepSeconds': PHYSICS_TIMESTEP,
            'controlDecimation': CONTROL_DECIMATION,
        },
        'samples': samples,
    }
'''
          pattern = r"def make_fixture\(sessions, hashes\):.*?\n\ndef main\(\) -> int:"
          updated, count = re.subn(pattern, new + "\n\ndef main() -> int:", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'fixture function replacement count: {count}')
          updated = updated.replace(
              'It executes the same pinned model assets and the same deployed controller contract as the\nbrowser workspace, and emits a machine-readable run report.',
              'It provides an independent deployed-controller conformance fixture and retains a legacy\nreference-runner surface. Phase 5C physical evidence is produced by the BAM-specific native runner.',
              1,
          )
          path.write_text(updated)
          PY
          python -m py_compile native/microduck_reference.py
      - name: Regenerate fixture and manifest
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'mujoco==3.11.0' numpy onnxruntime
          python native/microduck_reference.py --fixture assets/microduck/fixtures/controller-conformance.json
          node scripts/prepare_microduck_assets.mjs
      - name: Validate independent controller fixture
        run: |
          node tests/validate_microduck_assets.mjs
          node tests/physics/microduck-phase5c-core.mjs
          cp assets/microduck/fixtures/controller-conformance.json /tmp/fixture.json
          python native/microduck_reference.py --fixture /tmp/regenerated.json
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('/tmp/fixture.json').read_text())
          b = json.loads(Path('/tmp/regenerated.json').read_text())
          for doc in (a, b):
              doc['pins'].pop('mujoco', None)
          assert a == b, 'controller fixture is not reproducible'
          assert 'no MuJoCo state evolution' in a['inputSource']
          print('controller-only conformance fixture reproducible: OK')
          PY
      - name: Commit refreshed fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/microduck_reference.py assets/microduck/fixtures/controller-conformance.json assets/microduck/manifest.json assets/microduck/generated/procedural-rig.json
          git commit -m "fix(microduck): decouple controller fixture from plant dynamics"
          git push origin HEAD:fix/microduck-full-plant-fidelity
