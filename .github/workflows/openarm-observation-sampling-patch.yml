name: One-shot OpenArm observation sampling patch

on:
  push:
    branches: ["fix/openarm-phase5a-fidelity-review"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sampling-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure OpenArm evaluator observation cadence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/physics/openarm-physical-simulator.js')
          text = p.read_text()
          replacements = [
            (
              "const STEP_ALIGNMENT_TOLERANCE_SECONDS = 1e-9;\n",
              "const STEP_ALIGNMENT_TOLERANCE_SECONDS = 1e-9;\nconst OPENARM_OBSERVATION_BATCH_STEPS = 20; // 20 ms at the pinned 0.001 s timestep.\n",
            ),
            (
              "      legacyBaseYawRendered: false,\n",
              "      legacyBaseYawRendered: false,\n      observationBatchSteps: OPENARM_OBSERVATION_BATCH_STEPS,\n      observationPeriodSeconds: OPENARM_OBSERVATION_BATCH_STEPS * Number(this.lastObservation?.engine?.timestepSeconds || 0.001),\n",
            ),
            (
              "    const session = new PhysicsSession(new BrowserMuJoCoBackend({ workerUrl: new URL('./openarm-mujoco-worker.js', import.meta.url) }), { sessionId: `ide-openarm-v2-${++this.sessionSequence}` });\n",
              "    const session = new PhysicsSession(\n      new BrowserMuJoCoBackend({ workerUrl: new URL('./openarm-mujoco-worker.js', import.meta.url) }),\n      { sessionId: `ide-openarm-v2-${++this.sessionSequence}`, observationBatchSteps: OPENARM_OBSERVATION_BATCH_STEPS },\n    );\n",
            ),
          ]
          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected one simulator patch point, found {count}: {old!r}')
            text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Check patched source
        run: |
          node --check src/physics/session.js
          node --check src/physics/openarm-physical-simulator.js
          node tests/physics/vertical-slice-core.mjs
      - name: Commit observation cadence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/openarm-physical-simulator.js
          git commit -m "fix(openarm): sample authoritative state during long advances [sampling-patched]"
          git push
