name: Finalize LeKiwi Phase 5B

on:
  push:
    branches: ["fix/lekiwi-phase5b-physics"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lekiwi-phase5b-physics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final LeKiwi patch
        run: python scripts/finalize_lekiwi_phase.py

      - name: Run focused static contracts
        run: |
          node --check src/physics/lekiwi-physical-simulator.js
          node --check src/task-workspace.js
          node --check src/task-catalog.js
          node --check src/physics/ui-status.js
          node --check tests/lekiwi-presentation-browser.spec.mjs
          node tests/physics/lekiwi-phase5b-core.mjs
          node tests/validate_task_patch.mjs
          python -m py_compile native/lekiwi_reference.py
          python scripts/generate_lekiwi_models.py --check

      - name: Verify tighter wheel and traction numerics
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "mujoco==3.11.0"
          python native/lekiwi_reference.py --trial wheel-reference > /tmp/wheel-2ms.json
          python native/lekiwi_reference.py --trial wheel-reference --timestep 0.001 > /tmp/wheel-1ms.json
          python native/lekiwi_reference.py --trial traction-reduced > /tmp/traction-2ms.json
          python native/lekiwi_reference.py --trial traction-reduced --timestep 0.001 > /tmp/traction-1ms.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/wheel-2ms.json'))['metrics']; b=json.load(open('/tmp/wheel-1ms.json'))['metrics']
          c=json.load(open('/tmp/traction-2ms.json'))['metrics']; d=json.load(open('/tmp/traction-1ms.json'))['metrics']
          assert abs(a['grounded']['driveDirectionM']-b['grounded']['driveDirectionM']) < 0.02
          assert abs(a['anisotropyRatio']-b['anisotropyRatio']) < 0.35
          assert abs(c['travelRatio_0.5s']-d['travelRatio_0.5s']) < 0.08
          assert d['reduced_0.5s']['slipRatio'] > 0.5
          print({'wheel_anisotropy_2ms':a['anisotropyRatio'],'wheel_anisotropy_1ms':b['anisotropyRatio'],'traction_ratio_2ms':c['travelRatio_0.5s'],'traction_ratio_1ms':d['travelRatio_0.5s']})
          PY

      - name: Diagnose physical presentation frames
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          sed -i "/expect(initial.alignment.maxArmPivotErrorMm).not.toBeNull()/a\  console.log('INITIAL_ALIGNMENT', JSON.stringify(initial.alignment));" tests/lekiwi-presentation-browser.spec.mjs
          sed -i "/expect(arm.maxError).toBeLessThan/a\  console.log('ARM_ALIGNMENT', JSON.stringify(arm));" tests/lekiwi-presentation-browser.spec.mjs
          sed -i 's/toBeLessThan(12)/toBeLessThan(1000)/g' tests/lekiwi-presentation-browser.spec.mjs
          sed -i 's/toBeLessThan(180)/toBeLessThan(1000)/g' tests/lekiwi-presentation-browser.spec.mjs
          cat > playwright.finalize.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './tests', testMatch: /lekiwi-presentation-browser\.spec\.mjs/, workers: 1,
            timeout: 240000, expect: { timeout: 30000 },
            use: { baseURL: 'http://127.0.0.1:4173', headless: true, viewport: { width: 1366, height: 768 } },
            webServer: { command: 'python3 -m http.server 4173 --bind 127.0.0.1', url: 'http://127.0.0.1:4173/index.html', reuseExistingServer: false, timeout: 20000 },
          });
          EOF
          npx playwright test --config=playwright.finalize.config.mjs --reporter=line
          exit 1

      - name: Commit final LeKiwi corrections
        if: ${{ false }}
        run: echo diagnostic-only
