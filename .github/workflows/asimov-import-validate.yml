name: Import and verify Asimov integration
on:
  push:
    branches: [integration/asimov-physics-20260911]
    paths: [.github/workflows/asimov-import-validate.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/asimov-physics-20260911
      - uses: actions/checkout@v4
        with:
          repository: menloresearch/asimov-1
          ref: 732cc60dcb8f2b4fd26c3d7346b35f9b89c3cd47
          path: .asimov-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify transfer and apply reviewed source
        shell: python
        run: |
          import pathlib, base64, hashlib, lzma, subprocess
          parts = pathlib.Path('.asimov-transfer')
          if parts.exists():
              encoded = ''.join((parts / f'part{i}.b64').read_text().strip() for i in range(5))
              data = base64.b64decode(encoded, validate=True)
              assert len(data) == 30032
              assert hashlib.sha256(data).hexdigest() == '9006d6e54d017c636d2db1466224f1aa88f7941de56ae9c0a669fd733e69d592'
              patch = pathlib.Path('/tmp/asimov.patch'); patch.write_bytes(lzma.decompress(data))
              subprocess.run(['git','apply','--unidiff-zero','--check',str(patch)],check=True)
              subprocess.run(['git','apply','--unidiff-zero',str(patch)],check=True)
      - name: Generate lossless pinned models and publish feature branch source
        run: |
          python scripts/generate_asimov_models.py --source .asimov-upstream
          rm -rf .asimov-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LICENSE README.md THIRD_PARTY_NOTICES.md docs/physics/asimov* index.html playwright.config.mjs scripts/generate_asimov_models.py src models/asimov tests/asimov-physical-browser.spec.mjs tests/physics/asimov-worker.mjs tests/validate_asimov_native.py
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate source-pinned Asimov 1 with authoritative MuJoCo physics, full meshes, Python and WebMCP'
            git push origin HEAD:integration/asimov-physics-20260911
          fi
          git rev-parse HEAD | tee /tmp/asimov-tested-commit.txt
      - name: Install validation dependencies
        run: |
          npm ci
          python -m pip install mujoco==3.11.0
          npx playwright install --with-deps chromium
      - name: Static and existing core regressions
        run: |
          node tests/validate.mjs
          python tests/validate_starters.py
          for file in tests/physics/*core.mjs; do node "$file"; done
          node tests/webmcp-core.mjs
      - name: Actual shipped WASM and native source parity
        run: |
          ASIMOV_WASM_REPORT=/tmp/asimov-wasm.json node tests/physics/asimov-worker.mjs
          python tests/validate_asimov_native.py --wasm-report /tmp/asimov-wasm.json --upstream .asimov-upstream --report /tmp/asimov-native.json
      - name: Browser presentation, Python and WebMCP acceptance
        env:
          CI: 'true'
        run: npx playwright test tests/asimov-physical-browser.spec.mjs --workers=1
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p asimov-evidence
          cp /tmp/asimov-tested-commit.txt /tmp/asimov-native.json asimov-evidence/ 2>/dev/null || true
          cp -r test-results asimov-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asimov-integration-evidence
          path: asimov-evidence
          retention-days: 14
