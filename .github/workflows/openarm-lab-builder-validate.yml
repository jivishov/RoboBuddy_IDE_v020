name: Validate OpenArm Lab Builder

on:
  push:
    branches: ["lab-builder-v2"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: openarm-lab-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab-builder:
    if: github.repository == 'jivishov/RoboBuddy_IDE_v020'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and focused Lab Builder contracts
        run: |
          node --check src/physics/openarm-lab-builder.js
          node --check src/physics/openarm-lab-builder-base.js
          node --check src/physics/openarm-lab-equipment.js
          node --check src/physics/openarm-lab-equipment-base.js
          node --check src/physics/openarm-lab-transfer-evaluator.js
          node --check src/physics/openarm-lab-observation-profile.js
          node --check src/physics/openarm-lab-mujoco-worker.js
          node --check src/physics/openarm-lab-builder-simulator.js
          node --check src/physics/openarm-lab-builder-simulator-base.js
          node --check src/webmcp/openarm-workcell.js
          node --check src/task-catalog.js
          node --check src/task-workspace.js
          node --check src/simulator-host.js
          node tests/physics/openarm-lab-builder-core.mjs
          node tests/validate_task_patch.mjs
      - name: Install browser test dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Robot-only start, WebMCP authoring and physical dry-transfer browser test
        run: npx playwright test tests/openarm-lab-builder-browser.spec.mjs --reporter=line
      - name: Verification never rewrites checked-out source
        run: git diff --exit-code
      - name: Retain Lab Builder browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openarm-lab-builder-evidence-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
