name: Finalize MicroDuck provenance records

on:
  push:
    branches: [fix/microduck-full-plant-fidelity]
    paths: [.github/workflows/finalize-microduck-provenance.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/microduck-full-plant-fidelity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile final provenance records
        run: python scripts/finalize_microduck_provenance.py
      - name: Validate reconciled records
        run: |
          python -m py_compile scripts/finalize_microduck_provenance.py
          node --check src/physics/microduck-source-audit.js
          node --check src/physics/microduck-capabilities.js
          node tests/physics/microduck-bam-plant-core.mjs
          node tests/physics/microduck-phase5c-core.mjs
          node tests/physics/microduck-lifecycle-core.mjs
          node tests/validate.mjs
      - name: Commit final provenance reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/microduck-source-audit.js src/physics/microduck-capabilities.js docs/physics/microduck-provenance.md
          if git diff --cached --quiet; then
            echo "MicroDuck provenance already reconciled"
            exit 0
          fi
          git commit -m "docs(microduck): reconcile provenance with BAM collision plant"
          git push origin HEAD:fix/microduck-full-plant-fidelity
