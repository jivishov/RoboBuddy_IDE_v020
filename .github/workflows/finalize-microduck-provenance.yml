name: Finalize MicroDuck provenance records

on:
  push:
    branches: [fix/microduck-full-plant-fidelity]
    paths: [.github/workflows/finalize-microduck-provenance.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/microduck-full-plant-fidelity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct reconciled source-audit wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/physics/microduck-source-audit.js')
          text = path.read_text()
          old = "//   * MICRODUCK_RL_SOURCE is the physical/RL environment authority. It supplies the collision\n//     task-specific collision plants, the BAM training-plant configuration, the source XML"
          new = "//   * MICRODUCK_RL_SOURCE is the physical/RL environment authority. It supplies the\n//     task-specific collision plants, the BAM training-plant configuration, the source XML"
          if text.count(old) != 1:
              raise SystemExit(f'expected one provenance-header target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate final provenance records
        run: |
          node --check src/physics/microduck-source-audit.js
          node --check src/physics/microduck-capabilities.js
          node tests/physics/microduck-bam-plant-core.mjs
          node tests/physics/microduck-phase5c-core.mjs
          node tests/physics/microduck-lifecycle-core.mjs
          node tests/validate.mjs
          grep -q 'exact STL collision mesh bytes' docs/physics/microduck-provenance.md
          grep -q "BAM actuator model" src/physics/microduck-source-audit.js
          ! grep -E 'repository-authored boxes|largest declared actuator-fidelity gap|Neither is reproduced' src/physics/microduck-source-audit.js docs/physics/microduck-provenance.md
      - name: Commit wording correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/microduck-source-audit.js
          git commit -m "docs(microduck): polish source-audit provenance wording"
          git push origin HEAD:fix/microduck-full-plant-fidelity
