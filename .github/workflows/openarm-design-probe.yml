name: OpenArm Phase 5A design probe

on:
  push:
    branches: ["fix/openarm-phase5a-fidelity-review"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir "mujoco==3.11.0"
      - name: Sweep synthetic vessel grasp radii and physically compatible closure targets
        run: |
          python - <<'PY'
          import json, shutil, subprocess
          from pathlib import Path

          root = Path('.').resolve()
          cases = [
              ('legacy-envelope-moderate', 0.014, 0.025, 0.075, -0.355),
              ('legacy-envelope-firmer', 0.014, 0.025, 0.050, -0.330),
              ('legacy-envelope-contact', 0.014, 0.025, 0.100, -0.380),
              ('smaller-envelope', 0.016, 0.022, 0.100, -0.280),
          ]
          report = []
          for name, flask_radius, beaker_radius, left_hold, right_hold in cases:
              case_dir = Path('/tmp') / f'openarm-probe-{name}'
              if case_dir.exists(): shutil.rmtree(case_dir)
              shutil.copytree(root, case_dir)
              xml_path = case_dir / 'models/openarm_v2/manipulation.xml'
              xml = xml_path.read_text()
              xml = xml.replace('size="0.010 0.015" class="vessel"', f'size="{flask_radius:.3f} 0.015" class="vessel"', 1)
              xml = xml.replace('<body name="beaker" pos="0.509 -0.1535 1.120">', '<body name="beaker" pos="0.509 -0.1535 1.105">')
              xml = xml.replace('size="0.010 0.045" class="vessel"', f'size="{beaker_radius:.3f} 0.030" class="vessel"')
              xml_path.write_text(xml)

              runner_path = case_dir / 'native/openarm_v2_reference.py'
              runner = runner_path.read_text()
              runner = runner.replace("'initial_z': 1.120,", "'initial_z': 1.105,")
              runner = runner.replace("('left_close', {'openarm_left_finger_joint1': 0.0}, 0.50)", f"('left_close', {{'openarm_left_finger_joint1': {left_hold}}}, 0.50)")
              runner = runner.replace("arm('left', LEFT_LIFT, 0.0)", f"arm('left', LEFT_LIFT, {left_hold})")
              runner = runner.replace("arm('left', LEFT_TRANSFER, 0.0)", f"arm('left', LEFT_TRANSFER, {left_hold})")
              runner = runner.replace("arm('left', LEFT_PLACE, 0.0)", f"arm('left', LEFT_PLACE, {left_hold})")
              runner = runner.replace("('right_close', {'openarm_right_finger_joint1': 0.0}, 0.50)", f"('right_close', {{'openarm_right_finger_joint1': {right_hold}}}, 0.50)")
              runner = runner.replace("arm('right', RIGHT_LIFT, 0.0)", f"arm('right', RIGHT_LIFT, {right_hold})")
              runner = runner.replace("arm('right', RIGHT_TRANSFER, 0.0)", f"arm('right', RIGHT_TRANSFER, {right_hold})")
              runner = runner.replace("arm('right', RIGHT_PLACE, 0.0)", f"arm('right', RIGHT_PLACE, {right_hold})")
              runner_path.write_text(runner)

              output = subprocess.check_output(['python', str(runner_path), '--trial', 'nominal'], cwd=case_dir, text=True)
              result = json.loads(output)
              report.append({
                  'case': name,
                  'flaskRadiusM': flask_radius,
                  'beakerRadiusM': beaker_radius,
                  'leftHoldRad': left_hold,
                  'rightHoldRad': right_hold,
                  'success': result['metrics']['success'],
                  'flask': result['metrics']['flask'],
                  'beaker': result['metrics']['beaker'],
                  'stages': result['stages'],
              })
          Path('/tmp/openarm-design-probe.json').write_text(json.dumps(report, indent=2, sort_keys=True))
          print(json.dumps([{r['case']: {'success': r['success'], 'flask': r['flask'], 'beaker': r['beaker']}} for r in report], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openarm-design-probe-${{ github.sha }}
          path: /tmp/openarm-design-probe.json
          retention-days: 7
