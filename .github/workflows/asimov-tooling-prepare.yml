name: Prepare Asimov validation tools
on:
  push:
    branches: [integration/asimov-physics-20260911]
    paths: [.github/workflows/asimov-tooling-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download pinned native tools
        run: |
          mkdir -p tools/wheels
          python -m pip download --only-binary=:all: mujoco==3.11.0 -d tools/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: asimov-validation-tools-py313
          path: tools
          retention-days: 7
