name: Validate OpenArm Phase 5A

on:
  push:
    branches: [main, "fix/**", "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  openarm-phase5a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: OpenArm Phase 5A syntax contracts
        run: |
          node --check src/physics/backend-contract.js
          node --check src/physics/session.js
          node --check src/physics/browser-mujoco-backend.js
          node --check src/physics/mujoco-worker.js
          node --check src/physics/openarm-model-package.js
          node --check src/physics/openarm-scene.js
          node --check src/physics/openarm-task-evaluator.js
          node --check src/physics/openarm-mujoco-worker.js
          node --check src/physics/openarm-physical-simulator.js
          node --check src/webmcp/openarm-physical-control.js
          node --check tests/physics/openarm-phase5a-core.mjs
          node --check tests/openarm-phase5a-browser.spec.mjs
          python -m py_compile native/openarm_v2_reference.py

      - name: Shared physics session, backend and sampled-observation contracts
        run: node tests/physics/vertical-slice-core.mjs

      - name: OpenArm Phase 5A model, controller and evaluator contracts
        run: node tests/physics/openarm-phase5a-core.mjs

      - name: OpenArm physical task catalog and starter contracts
        run: node tests/validate_task_patch.mjs

      - name: Generate native MuJoCo nominal, negative and sensitivity evidence
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "mujoco==3.11.0"
          python native/openarm_v2_reference.py --trial nominal > /tmp/openarm-nominal.json
          python native/openarm_v2_reference.py --trial miss-left > /tmp/openarm-miss.json
          python native/openarm_v2_reference.py --trial weak-grip > /tmp/openarm-weak.json
          python native/openarm_v2_reference.py --trial blocked-left > /tmp/openarm-blocked.json
          python native/openarm_v2_reference.py --trial outside-left > /tmp/openarm-outside.json
          python native/openarm_v2_reference.py --trial insufficient-budget > /tmp/openarm-budget.json
          python native/openarm_v2_reference.py --trial nominal --timestep 0.0005 > /tmp/openarm-tight.json

      - name: Retain native OpenArm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openarm-phase5a-native-evidence-${{ github.sha }}
          path: /tmp/openarm-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate native MuJoCo nominal, negative and sensitivity gates
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          def load(name): return json.loads(Path(name).read_text())
          nominal=load('/tmp/openarm-nominal.json')
          miss=load('/tmp/openarm-miss.json')
          weak=load('/tmp/openarm-weak.json')
          blocked=load('/tmp/openarm-blocked.json')
          outside=load('/tmp/openarm-outside.json')
          budget=load('/tmp/openarm-budget.json')
          tight=load('/tmp/openarm-tight.json')
          print('OpenArm nominal metrics:', json.dumps(nominal['metrics'], sort_keys=True))
          print('OpenArm negative success:', {r['trial']: r['metrics']['success'] for r in (miss, weak, blocked, outside, budget)})
          print('OpenArm tight metrics:', json.dumps(tight['metrics'], sort_keys=True))
          assert nominal['classification'].startswith('native/browser model implementation comparison')
          assert nominal['engine']['version']=='3.11.0', nominal['engine']
          assert abs(nominal['engine']['timestepSeconds']-0.001)<1e-12
          assert nominal['engine']['iterations'] > 0
          assert nominal['model']['id'] == 'robobuddy-openarm-v2-phase5a-v2', nominal['model']
          assert nominal['model']['packageId'] == 'openarm-v2-phase5a-a8c9796-v2', nominal['model']
          assert nominal['controller']['id'] == 'openarm-v2-bimanual-stack-v2', nominal['controller']
          assert len(nominal['model']['sha256']) == 64, nominal['model']
          assert len(nominal['controller']['sha256']) == 64, nominal['controller']
          assert nominal['model']['neq']==2, nominal['model']
          assert nominal['model']['hasObjectWeld'] is False, nominal['model']
          assert nominal['initialState']['simulationTimeSeconds'] == 0.0
          assert len(nominal['commandSequence']) == 15
          assert len(nominal['objectTrajectories']) > 10
          assert nominal['taskVerdict'] == 'success', nominal['metrics']
          assert nominal['metrics']['success'] is True, nominal['metrics']
          for obj in ('flask','beaker'):
              metric=nominal['metrics'][obj]
              assert metric['bilateralContact'] is True, metric
              assert metric['supportWhileHeld'] is True, metric
              assert metric['released'] is True, metric
              assert metric['settled'] is True, metric
              assert metric['retreated'] is True, metric
              assert metric['retreatDistanceM'] >= 0.05, metric
              assert metric['settleDriftM'] is not None and metric['settleDriftM'] <= 0.001, metric
              assert metric['supportWhileHeldTimeSeconds'] < metric['releaseTimeSeconds'] < metric['settleTimeSeconds'] < metric['retreatTimeSeconds'], metric
          for result in (miss, weak, blocked, outside, budget):
              assert result['metrics']['success'] is False, (result['trial'], result['metrics'])
          assert tight['metrics']['success'] is True, tight['metrics']
          for side, expected_y in [('left',0.1535),('right',-0.1535)]:
              ee=nominal['homeEeM'][side]
              assert abs(ee[0]-0.401)<0.003 and abs(ee[1]-expected_y)<0.003 and abs(ee[2]-1.120)<0.003, (side,ee)
          for obj in ('flask','beaker'):
              a=nominal['metrics'][obj]['finalPositionM']; b=tight['metrics'][obj]['finalPositionM']
              delta=math.sqrt(sum((x-y)**2 for x,y in zip(a,b)))
              assert delta<=0.02,(obj,a,b,delta)
          print('OpenArm native nominal/negative/sensitivity gates: OK')
          PY

      - name: Install browser harness
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: OpenArm browser authority and task gates
        run: npx playwright test tests/openarm-phase5a-browser.spec.mjs --reporter=line

      - name: Retain OpenArm browser causal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openarm-browser-evidence-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
