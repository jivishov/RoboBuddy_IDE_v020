name: Import reviewed Asimov actuator extension
on:
  push:
    branches: [integration/asimov-actuator-fidelity-20260911]
    paths: [.github/workflows/asimov-actuator-import.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'jivishov/RoboBuddy_IDE_v020'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/asimov-actuator-fidelity-20260911
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check transfer and apply reviewed non-workflow changes
        shell: python
        run: |
          import base64,hashlib,lzma,pathlib,subprocess
          data=base64.b64decode(''.join(pathlib.Path(f'.asimov-actuator-transfer/part{i}.b64').read_text().strip() for i in range(2)),validate=True)
          assert len(data)==24568
          assert hashlib.sha256(data).hexdigest()=='9204fa2544bb04b6426af1edd903b899270f9d22786e52ebbe12585c6d8c8856'
          patch=pathlib.Path('/tmp/asimov-actuator.patch');patch.write_bytes(lzma.decompress(data))
          subprocess.run(['git','apply','--exclude=.github/workflows/*','--unidiff-zero','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','--unidiff-zero',str(patch)],check=True)
      - name: Generate and check source
        run: |
          python scripts/generate_asimov_actuator_models.py
          node tests/validate.mjs
          python tests/validate_starters.py
          node tests/physics/asimov-actuator-core.mjs
          node tests/physics/asimov-actuator-worker.mjs
          node tests/webmcp-core.mjs
          git diff --check
      - name: Commit reviewed application source
        run: |
          rm -rf .asimov-actuator-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add source-informed Asimov actuator profiles, synthetic sensors and bounded standing trial'
          git push origin HEAD:integration/asimov-actuator-fidelity-20260911
