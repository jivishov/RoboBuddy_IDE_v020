name: Prepare pinned Asimov source
on:
  push:
    branches: [integration/asimov-physics-20260911]
    paths: [.github/workflows/asimov-source-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: menloresearch/asimov-1
          ref: 732cc60dcb8f2b4fd26c3d7346b35f9b89c3cd47
          path: upstream
          persist-credentials: false
      - name: Package source and license evidence
        run: |
          mkdir source-evidence
          cp -r upstream/sim-model source-evidence/
          cp upstream/*LICENSE* source-evidence/
          git -C upstream rev-parse HEAD > source-evidence/REVISION
          git -C upstream ls-tree -r HEAD > source-evidence/GIT_TREE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-asimov-source
          path: source-evidence
          retention-days: 14
