name: Materialize checksum-pinned general scene review
on:
  push:
    branches: [feat/openarm-general-scene-builder]
    paths: ['.github/general-review-source/**', '.github/workflows/materialize-general-review.yml']
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'jivishov/RoboBuddy_IDE_v020' && github.ref == 'refs/heads/feat/openarm-general-scene-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact locally tested review changes to the review branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9356512a99869655b93245467e6a7bac0c5c5f01"
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess, tempfile
          hashes = ['c37c559eea59ff6a3068804a2732e8825e4e264ab73b80995224d9eed8e0efdd', '6c1ee5b0aec8dea432ac46c8c57061c93d7e79bdcaada2994242ad316b90f9b2']
          chunks = []
          for i, expected in enumerate(hashes):
              content = pathlib.Path(f'.github/general-review-source/part-{i}.txt').read_text().strip()
              assert hashlib.sha256(content.encode()).hexdigest() == expected
              chunks.append(content)
          patch = lzma.decompress(base64.b64decode(''.join(chunks), validate=True), memlimit=128*1024*1024)
          assert len(patch) == 57271
          assert hashlib.sha256(patch).hexdigest() == 'f97f9e45a31f5fc76bebff5b752c5e5dcd9602b902edc1d7153694f538ed7232'
          with tempfile.NamedTemporaryFile() as f:
              f.write(patch); f.flush()
              subprocess.run(['git','apply','--unidiff-zero','--index','--check',f.name], check=True)
              subprocess.run(['git','apply','--unidiff-zero','--index',f.name], check=True)
          expected_files = {
              'docs/physics/GENERAL_LAB_SCENE_BUILDER.md': '15bfb166f1017fed082dc7c72c4ce3803c7260ad',
              'src/physics/openarm-general-scene.js': '41c466091109ad69849e4a736673fdf4b96c3e3d',
              'src/physics/openarm-general-schema.js': '461ff522472c10672fdd1171fc6ac11b3c7eecd5',
              'src/physics/openarm-general-task.js': '34c918018f93b309701aefccaa34ad6d315bbe20',
              'src/physics/openarm-mujoco-worker.js': '6eade06eb5689e6aaea6f84ce61a0b4a29cfd7e9',
              'src/physics/openarm-physical-simulator.js': 'a08ec23157d38cb34917cd6e0e25a0b95adcea4b',
              'src/ui/general-lab-builder.js': 'd3042a20c7a3a0a088a00dff480eea4ad4567b24',
              'src/webmcp/openarm-scene-builder.js': '7271e4886e2d099bc27df426c54d212746576ca8',
              'tests/openarm-general-scene-browser.spec.mjs': '87a40f06acd74a4b4b6de22889ffe8baf8f4c733',
              'tests/physics/openarm-general-review.mjs': '1d8af5cbc23c2180065bf6ace65b02fe47fc31c0',
              'tests/validate_general_scene_schemas.py': '3645b0731d42a302486f9242f385d25366874072'
          }
          assert set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()) == set(expected_files)
          for path, expected in expected_files.items():
              assert subprocess.check_output(['git','hash-object',path]).decode().strip() == expected, path
          PY
          git rm .github/general-review-source/part-*.txt
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(openarm): harden general scene fidelity and task evidence" -m "Preserve measured/default provenance, correct round support geometry and task schemas, reject assisted or interrupted carry, use settled COM references, prevent stale draft application, and align authored task telemetry. Add targeted adversarial and actual MuJoCo regressions. Source bytes match the locally tested review; final CI remains read-only. No main or Pages changes."
          test "$(git ls-remote origin refs/heads/feat/openarm-general-scene-builder | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/openarm-general-scene-builder
