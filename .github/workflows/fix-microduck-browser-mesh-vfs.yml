name: Apply MicroDuck browser mesh VFS fix

on:
  push:
    branches:
      - fix/microduck-full-plant-fidelity
    paths:
      - .github/workflows/fix-microduck-browser-mesh-vfs.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/microduck-full-plant-fidelity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact-mesh VFS loader patch
        run: python scripts/apply_microduck_browser_mesh_vfs_fix.py
      - name: Validate exact-mesh VFS loader contracts
        run: |
          node --check src/physics/microduck-mujoco-worker.js
          node --check tests/physics/microduck-browser-mesh-vfs-core.mjs
          node tests/physics/microduck-browser-mesh-vfs-core.mjs
          node tests/physics/microduck-phase5c-core.mjs
          node tests/physics/microduck-lifecycle-core.mjs
      - name: Push tested source fix
        run: |
          git checkout -- .github/workflows/microduck-phase5c-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/physics/microduck-mujoco-worker.js tests/physics/microduck-browser-mesh-vfs-core.mjs
          git commit -m "fix(microduck): load exact collision meshes through MuJoCo VFS"
          git push origin HEAD:fix/microduck-full-plant-fidelity
