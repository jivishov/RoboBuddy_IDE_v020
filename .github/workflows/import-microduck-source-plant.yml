name: Import pinned MicroDuck source plant

on:
  push:
    branches: [fix/microduck-full-plant-fidelity]
    paths: [.github/workflows/import-microduck-source-plant.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/microduck-full-plant-fidelity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact pinned MicroDuck RL source
        run: |
          rm -rf /tmp/microduck_rl
          git clone --filter=blob:none https://github.com/pollen-robotics/microduck_rl.git /tmp/microduck_rl
          git -C /tmp/microduck_rl checkout --detach 519142b1f5bf59fdfd44d06c205119e7fff8e3cb
          test "$(git -C /tmp/microduck_rl rev-parse HEAD)" = "519142b1f5bf59fdfd44d06c205119e7fff8e3cb"
      - name: Materialize exact task-specific source geometry and licensing
        run: |
          python scripts/finalize_microduck_full_plant.py --source-checkout /tmp/microduck_rl
          python scripts/finalize_microduck_collision_routing.py
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          fixture = Path('assets/microduck/fixtures/controller-conformance.json')
          doc = json.loads(fixture.read_text())
          doc['model']['sha256'] = hashlib.sha256(Path('models/microduck/walk.xml').read_bytes()).hexdigest()
          fixture.write_text(json.dumps(doc, indent=2) + '\n')
          PY
          node scripts/prepare_microduck_assets.mjs
      - name: Verify imported mesh byte identities and deterministic generation
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          pin_dir = Path('/tmp/microduck_rl/src/mjlab_microduck/robot/microduck/assets')
          dst = Path('models/microduck/assets')
          sums = Path('models/microduck/source/GIT_BLOB_SHA1SUMS').read_text()
          for src in sorted(pin_dir.glob('*.stl')):
              copied = dst / src.name
              assert copied.read_bytes() == src.read_bytes(), src.name
              data = copied.read_bytes()
              blob = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              assert f'{blob}  assets/{src.name}' in sums, src.name
          print('all imported STL bytes match pinned upstream source')
          PY
          python scripts/generate_microduck_models.py --check
          node tests/validate_microduck_assets.mjs
      - name: Commit materialized plant and collision routing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(microduck): refresh physical plant asset integrity"
          git push origin HEAD:fix/microduck-full-plant-fidelity
