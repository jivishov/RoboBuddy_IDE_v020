name: Apply and verify MicroDuck collision routing

on:
  push:
    branches: [fix/microduck-full-plant-fidelity]
    paths: [.github/workflows/import-microduck-source-plant.yml]

permissions:
  contents: write

jobs:
  apply-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/microduck-full-plant-fidelity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact pinned MicroDuck RL source
        run: |
          rm -rf /tmp/microduck_rl
          git clone --filter=blob:none https://github.com/pollen-robotics/microduck_rl.git /tmp/microduck_rl
          git -C /tmp/microduck_rl checkout --detach 519142b1f5bf59fdfd44d06c205119e7fff8e3cb
          test "$(git -C /tmp/microduck_rl rev-parse HEAD)" = "519142b1f5bf59fdfd44d06c205119e7fff8e3cb"
      - name: Verify committed source bytes against pinned upstream
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          pin = Path('/tmp/microduck_rl/src/mjlab_microduck/robot/microduck')
          source = Path('models/microduck/source')
          meshes = Path('models/microduck/assets')
          for name in ('robot_walk.xml', 'robot_allcollisions.xml', 'ball.xml', 'config_mjcf_walk.json'):
              upstream = pin / name
              if upstream.exists():
                  assert (source / name).read_bytes() == upstream.read_bytes(), f'{name}: committed source byte mismatch'
          sums = (source / 'GIT_BLOB_SHA1SUMS').read_text()
          upstream_meshes = sorted((pin / 'assets').glob('*.stl'))
          assert upstream_meshes
          assert {p.name for p in upstream_meshes} == {p.name for p in meshes.glob('*.stl')}
          for src in upstream_meshes:
              data = (meshes / src.name).read_bytes()
              assert data == src.read_bytes(), f'{src.name}: committed STL byte mismatch'
              blob = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              assert f'{blob}  assets/{src.name}' in sums, f'{src.name}: Git blob provenance mismatch'
          print('committed MicroDuck source XML/STL bytes match pinned upstream')
          PY
      - name: Apply task-specific collision routing migration
        run: |
          python scripts/finalize_microduck_collision_routing.py
          python - <<'PY'
          from pathlib import Path

          phase = Path('tests/physics/microduck-phase5c-core.mjs')
          text = phase.read_text()
          replacements = {
              "assert(MICRODUCK_MODEL_PACKAGES.length === 3, `expected three packages, found ${MICRODUCK_MODEL_PACKAGES.length}`);":
                  "assert(MICRODUCK_MODEL_PACKAGES.length === 4, `expected four task-specific packages, found ${MICRODUCK_MODEL_PACKAGES.length}`);",
              "/not hardware accuracy|assembled MicroDuck/": "/hardware-validation|assembled-hardware|assembled MicroDuck/",
              "assert(tasks.length === 2, `MicroDuck should expose both workspaces, saw ${tasks.length}`);":
                  "assert(tasks.length === 4, `MicroDuck should expose one legacy plus three task-specific physical workspaces, saw ${tasks.length}`);",
              "  const physical = tasks.find((item) => item.id === 'microduck-physical-locomotion');\n  assert(demonstrator && demonstrator.simulationMode === 'policy_sim', 'the policy demonstrator is no longer a selectable MicroDuck workspace');\n  assert(physical && physical.simulationMode === 'physical_mujoco', 'the physical locomotion workspace is no longer a selectable MicroDuck workspace');":
                  "  const physical = tasks.find((item) => item.id === 'microduck-physical-locomotion');\n  const groundContact = tasks.find((item) => item.id === 'microduck-physical-groundcontact');\n  const kick = tasks.find((item) => item.id === 'microduck-physical-kick');\n  assert(demonstrator && demonstrator.simulationMode === 'policy_sim', 'the policy demonstrator is no longer a selectable MicroDuck workspace');\n  assert(physical && physical.simulationMode === 'physical_mujoco', 'the physical locomotion workspace is no longer a selectable MicroDuck workspace');\n  assert(groundContact && groundContact.simulationMode === 'physical_mujoco', 'the physical ground-contact workspace is missing');\n  assert(kick && kick.simulationMode === 'physical_mujoco', 'the physical kick workspace is missing');",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'phase5c test migration target count {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          phase.write_text(text)

          bam = Path('tests/physics/microduck-bam-plant-core.mjs')
          text = bam.read_text()
          old = "assert(MICRODUCK_WALK_PACKAGE.limitations.some((text) => /license-constrained/i.test(text)));"
          new = "assert(MICRODUCK_WALK_PACKAGE.limitations.some((text) => /Creative Commons BY-SA-NC/i.test(text)), 'source 3D collision asset license is not disclosed');\nassert(MICRODUCK_WALK_PACKAGE.limitations.some((text) => /outside .*MIT scope|outside RoboBuddy original-code MIT scope/i.test(text)), 'source 3D collision assets are not scoped outside RoboBuddy MIT code');"
          if text.count(old) != 1:
              raise SystemExit('BAM license assertion migration target drifted')
          bam.write_text(text.replace(old, new, 1))

          lifecycle = Path('tests/physics/microduck-lifecycle-core.mjs')
          text = lifecycle.read_text()
          old = "  assert(worker.counts('command') === before, 'a refused capability still reached the authority');\n  assert(sim.requestSkill('kick_right').accepted === true, 'a supported capability was refused');\n  sim.dispose();"
          new = "  assert(worker.counts('command') === before, 'a refused capability still reached the authority');\n  const wrongPlant = sim.requestSkill('kick_right');\n  assert(wrongPlant.accepted === false && wrongPlant.status === 'wrong-plant', 'kick was not rejected on the walking collision plant');\n  assert(wrongPlant.requiredPackageKeys?.includes('kick'), 'wrong-plant response did not identify the required kick plant');\n  assert(worker.counts('command') === before, 'a wrong-plant capability reached the authority');\n  sim.dispose();"
          if text.count(old) != 1:
              raise SystemExit('lifecycle wrong-plant migration target drifted')
          lifecycle.write_text(text.replace(old, new, 1))
          PY
      - name: Refresh integrity metadata and validate static routing
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          fixture = Path('assets/microduck/fixtures/controller-conformance.json')
          doc = json.loads(fixture.read_text())
          doc['model']['sha256'] = hashlib.sha256(Path('models/microduck/walk.xml').read_bytes()).hexdigest()
          fixture.write_text(json.dumps(doc, indent=2) + '\n')
          PY
          node scripts/prepare_microduck_assets.mjs
          python scripts/generate_microduck_models.py --check
          node tests/validate_microduck_assets.mjs
          node tests/physics/microduck-bam-plant-core.mjs
          node tests/physics/microduck-phase5c-core.mjs
          node tests/physics/microduck-lifecycle-core.mjs
      - name: Commit collision routing implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src native tests assets/microduck
          if git diff --cached --quiet; then
            echo "MicroDuck collision routing already converged"
            exit 0
          fi
          git commit -m "fix(microduck): apply task-specific collision plant routing"
          git push origin HEAD:fix/microduck-full-plant-fidelity
