name: Finalize Asimov browser integration
on:
  push:
    branches: [integration/asimov-physics-20260911]
    paths: [.github/workflows/asimov-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/asimov-physics-20260911
      - name: Apply reviewed fidelity corrections
        shell: python
        run: |
          import base64,lzma,hashlib,pathlib,subprocess
          encoded=''''''
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='9b2240007fd3de14c6a95a6dd6d49782d3e190d72b88f29a74bfeb75613992c0'
          path=pathlib.Path('/tmp/polish.patch');path.write_bytes(lzma.decompress(data))
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
      - name: Validate and commit source
        run: |
          node --check tests/asimov-physical-browser.spec.mjs
          node --check src/app-v2.js
          node tests/validate.mjs
          for file in tests/physics/*core.mjs; do node "$file"; done
          node tests/webmcp-core.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/asimov-physical-browser.spec.mjs src/profiles.js src/physics/capabilities.js src/physics/ui-status.js src/app-v2.js docs/physics/asimov-provenance.md
          git commit -m 'fix: align Asimov physical capability labels, telemetry, completion status and browser lifecycle checks'
          git push origin HEAD:integration/asimov-physics-20260911
